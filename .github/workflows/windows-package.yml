name: Windows package

# Windows packaging and installed-app validation (#41). Separate from ci.yml, which owns the Ubuntu checks.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      BINGO_DATA: ${{ runner.temp }}\bingo-user-data
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Test source
      run: npm test
    - name: Build
      run: npm run build
    - name: Test built artifacts
      run: npm run test:build
    - name: Package 0.1.0 and 0.1.1 installers
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        npx electron-builder --win nsis --x64 --config electron-builder.win.yml --publish never
        npm version 0.1.1 --no-git-tag-version
        npx electron-builder --win nsis --x64 --config electron-builder.win.yml --publish never
    - name: Install 0.1.0 and seed a temporary profile
      run: |
        Start-Process -Wait (Resolve-Path release/windows/Bingo-Setup-0.1.0-x64.exe) -ArgumentList '/S'
        $app = ./scripts/windows-installed.ps1 -Version 0.1.0
        node verification/packaged-smoke.mjs $app $env:BINGO_DATA seed
    - name: Upgrade to 0.1.1 and verify the same profile
      run: |
        Start-Process -Wait (Resolve-Path release/windows/Bingo-Setup-0.1.1-x64.exe) -ArgumentList '/S'
        $app = ./scripts/windows-installed.ps1 -Version 0.1.1
        node verification/packaged-smoke.mjs $app $env:BINGO_DATA upgraded
    - name: Uninstall keeps event data
      run: |
        ./scripts/windows-installed.ps1 -Uninstall
        if (-not (Test-Path "$env:BINGO_DATA\current-event.sqlite")) { throw 'uninstall removed event data' }
    - name: Remove temporary profile
      if: always()
      run: Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $env:BINGO_DATA
    - uses: actions/upload-artifact@v4
      with:
        name: bingo-windows-unsigned
        path: release/windows/Bingo-Setup-*.exe
        if-no-files-found: error
        retention-days: 7
