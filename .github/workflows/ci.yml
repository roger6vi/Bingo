name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
    - name: Install dependencies
      run: npm ci
    # test:components downloads Playwright's Chromium; Storybook verification reuses the same browser.
    - name: Cache Playwright Chromium
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
    - name: Install Chromium system dependencies
      run: npx playwright install-deps chromium
    - name: Enable the Electron sandbox helper
      run: sudo chown root:root node_modules/electron/dist/chrome-sandbox && sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
    - name: Test source
      run: npm test
    - name: Test tokens
      run: npm run test:tokens
    - name: Build
      run: npm run build
    - name: Test built artifacts
      run: npm run test:build
    - name: Test browser components
      run: npm run test:components
    - name: Build Storybook
      run: npm run storybook:build
    - name: Verify Storybook
      id: storybook
      timeout-minutes: 20
      run: npm run storybook:verify -- --failures "$RUNNER_TEMP/storybook-verify"
    - name: Upload Storybook verification failures
      if: failure() && steps.storybook.outcome == 'failure'
      uses: actions/upload-artifact@v4
      with:
        name: storybook-verify
        path: ${{ runner.temp }}/storybook-verify
        if-no-files-found: warn
        retention-days: 14
    - name: Electron smoke
      id: smoke
      timeout-minutes: 5
      env:
        SMOKE_ARTIFACTS_DIR: ${{ runner.temp }}/electron-smoke
      run: xvfb-run -a npm run test:smoke
    - name: Upload Electron smoke artifacts
      if: failure() && steps.smoke.outcome == 'failure'
      uses: actions/upload-artifact@v4
      with:
        name: electron-smoke
        path: ${{ runner.temp }}/electron-smoke
        if-no-files-found: warn
        retention-days: 14
