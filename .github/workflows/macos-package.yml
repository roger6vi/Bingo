name: macOS package

# Unsigned macOS packaging (#40). Signing and notarization need Apple credentials and are documented
# in docs/macos-packaging.md; this workflow uses no repository secrets or signing identity.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Test source
      run: npm test
    - name: Package unsigned macOS app (arm64 and x64)
      run: npm run package:mac
    - name: Test built artifacts
      run: npm run test:build
    - name: Verify ad-hoc code signature
      run: codesign --verify --deep --strict --verbose=2 release/mac-arm64/Bingo.app
    - name: Smoke packaged app with a temporary user-data directory
      run: npm run test:package
    - uses: actions/upload-artifact@v4
      with:
        name: bingo-macos-unsigned-${{ github.sha }}
        path: |
          release/*.dmg
          release/*.zip
        if-no-files-found: error
        retention-days: 14
