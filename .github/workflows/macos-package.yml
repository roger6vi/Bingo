name: macOS package

# Unsigned macOS packaging (#40). Signing and notarization need Apple credentials and are documented
# in docs/macos-packaging.md; this workflow uses no repository secrets or signing identity.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Test source
      run: npm test
    - name: Package unsigned macOS app (arm64 and x64)
      run: npm run package:mac
      env:
        # electron-builder skips all signing on pull requests, even ad-hoc, leaving an invalid arm64
        # signature. Ad-hoc signing uses no credentials, so it is safe to allow here.
        CSC_FOR_PULL_REQUEST: 'true'
    - name: Test built artifacts
      run: npm run test:build
    - name: Verify ad-hoc code signature
      run: codesign --verify --deep --strict --verbose=2 release/mac-arm64/Bingo.app
    - name: Smoke packaged cue sounds and no-replay across restarts
      run: node verification/packaged-cue-smoke.mjs
    - name: Choose a temporary user-data directory
      run: echo "BINGO_DATA=$RUNNER_TEMP/bingo-user-data" >> "$GITHUB_ENV"
    - name: Install 0.1.0 from the dmg and seed the temporary profile
      run: |
        app=$(scripts/macos-install.sh release/Bingo-0.1.0-arm64.dmg "$RUNNER_TEMP/Applications" 0.1.0)
        node verification/packaged-smoke.mjs "$app" "$BINGO_DATA" seed
    - name: Package 0.1.1 arm64 zip
      run: |
        npm version 0.1.1 --no-git-tag-version
        npx electron-builder --mac zip --arm64 --publish never -c.mac.identity=- -c.mac.notarize=false -c.directories.output=release/upgrade
      env:
        CSC_FOR_PULL_REQUEST: 'true'
    - name: Upgrade to 0.1.1 over the installed app and verify the same profile
      run: |
        app=$(scripts/macos-install.sh release/upgrade/Bingo-0.1.1-arm64-mac.zip "$RUNNER_TEMP/Applications" 0.1.1)
        node verification/packaged-smoke.mjs "$app" "$BINGO_DATA" upgraded
    - name: Remove temporary profile
      if: always()
      run: if [ -n "${BINGO_DATA:-}" ]; then rm -rf "$BINGO_DATA"; fi
    - uses: actions/upload-artifact@v4
      with:
        name: bingo-macos-unsigned-${{ github.sha }}
        path: |
          release/*.dmg
          release/*.zip
        if-no-files-found: error
        retention-days: 14
