<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; media-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Public display</title>
</head>
<body>
  <bingo-shell>
  <main>
    <h1 id="event-name">Current event</h1>
    <p id="event-details" class="event-details" hidden></p>
    <div class="public-layout">
      <div class="public-side">
      <bingo-panel heading="Latest committed draw">
        <bingo-latest-draw id="latest-draw">
          <bingo-number id="latest-number"></bingo-number>
        </bingo-latest-draw>
        <bingo-status id="phase-status"></bingo-status>
        <bingo-status id="event-status"></bingo-status>
        <bingo-status id="event-error" hidden></bingo-status>
        <p>Called: <output id="called-count" aria-live="off">0</output> · Remaining: <output id="remaining-count" aria-live="off">90</output></p>
      </bingo-panel>
      <!-- Prizes share the draw column so the number board keeps its full width and height. -->
      <bingo-panel heading="Premios" lang="es" class="prize-panel">
        <dl id="prizes" class="prize-list">
          <div class="prize">
            <dt>Línea</dt>
            <dd id="prize-line"><span id="prize-line-amount" class="prize-amount" hidden></span><span id="prize-line-lot" class="prize-lot" hidden></span><span id="prize-line-empty" class="prize-empty">Premio por confirmar</span></dd>
          </div>
          <div class="prize">
            <dt>Bingo</dt>
            <dd id="prize-bingo"><span id="prize-bingo-amount" class="prize-amount" hidden></span><span id="prize-bingo-lot" class="prize-lot" hidden></span><span id="prize-bingo-empty" class="prize-empty">Premio por confirmar</span></dd>
          </div>
        </dl>
      </bingo-panel>
      </div>
      <bingo-panel heading="Called numbers (draw order)">
        <bingo-number-board id="called-numbers"></bingo-number-board>
      </bingo-panel>
    </div>
  </main>
  <bingo-panel class="sample-panel" heading="Sample media preview (not event state)">
    <video controls width="480" preload="none">
      <source id="sample-video-source" type="video/mp4">
      This browser cannot play the local sample video.
    </video>
    <p>Use the player controls to start playback; sound will not start automatically.</p>
  </bingo-panel>
  </bingo-shell>
  <script type="module" src="./public-ui.mjs"></script>
</body>
</html>
