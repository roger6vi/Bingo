<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; media-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Public display</title>
</head>
<body>
  <bingo-shell>
  <main>
    <h1>Current event</h1>
    <div class="public-layout">
      <bingo-panel heading="Latest committed draw">
        <bingo-latest-draw id="latest-draw">
          <bingo-number id="latest-number"></bingo-number>
        </bingo-latest-draw>
        <bingo-status id="event-status"></bingo-status>
        <bingo-status id="event-error" hidden></bingo-status>
        <p>Called: <output id="called-count" aria-live="off">0</output> · Remaining: <output id="remaining-count" aria-live="off">90</output></p>
      </bingo-panel>
      <bingo-panel heading="Called numbers (draw order)">
        <ol id="called-numbers" aria-label="Called numbers in draw order"></ol>
      </bingo-panel>
    </div>
  </main>
  <bingo-panel class="sample-panel" heading="Sample media preview (not event state)">
    <video controls width="480" preload="none">
      <source id="sample-video-source" type="video/mp4">
      This browser cannot play the local sample video.
    </video>
    <p>Use the player controls to start playback; sound will not start automatically.</p>
  </bingo-panel>
  </bingo-shell>
  <script type="module" src="./public-ui.mjs"></script>
</body>
</html>
