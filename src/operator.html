<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; media-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Operator console</title>
</head>
<body>
  <bingo-shell>
  <main>
    <h1>Operator console</h1>
    <div class="operator-layout">
      <bingo-panel heading="Current event">
        <bingo-status id="event-status"></bingo-status>
        <bingo-status id="event-error" hidden></bingo-status>
        <bingo-operator-summary id="event-summary"></bingo-operator-summary>
        <bingo-call-history id="called-numbers"></bingo-call-history>
        <bingo-draw-controls id="draw-controls"></bingo-draw-controls>
      </bingo-panel>
      <bingo-panel heading="Public window preview">
        <div class="public-controls">
          <bingo-button id="open-public">Open / reopen public window</bingo-button>
          <bingo-button id="move-public">Move public window to secondary display</bingo-button>
        </div>
        <bingo-status id="public-status" hidden></bingo-status>
      </bingo-panel>
    </div>
    <p>Claims and prizes are not implemented.</p>
  </main>
  </bingo-shell>
  <script type="module" src="./operator-ui.mjs"></script>
</body>
</html>
